<!--
  Punto de Venta UV — Vista de Inicio de Sesión (HU01)
  Proyecto: La Number One
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punto de Venta UV · Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/01-variables.css" />
  <link rel="stylesheet" href="/css/02-base.css" />
  <link rel="stylesheet" href="/css/04-components.css" />
  <link rel="stylesheet" href="/css/05-modals.css" />
  <link rel="stylesheet" href="/css/07-login.css" />
</head>
<body>

  <div class="auth-card">

    <!-- Panel de marca (Izquierda con estructura de la referencia) -->
    <section class="brand-panel">
      <!-- 1. Nombre arriba -->
      <div class="brand-panel__top">
        <div class="brand-panel__header">
          <div>
            <h1>La Number One</h1>
            <p class="muted">Tiendita de la esquina</p>
          </div>
        </div>
      </div>

      <!-- 2. Imagen centrada -->
      <div class="brand-panel__media">
        <img src="img/logo.png" alt="Logo de La Number One" />
      </div>

      <!-- 3. Tiendas para toda la familia abajo -->
      <div class="brand-panel__content">
        <h2 class="tagline">Tiendas para toda la familia</h2>
        <p class="tagline-sub">
          De la revo para el mundo.
        </p>

        <div class="brand-footer">
          🔒 Cifrado AES-256 · SSO Institucional © 2026 Universidad Veracruzana
        </div>
      </div>
    </section>

    <!-- Panel de formulario (Derecha) -->
    <section class="form-panel">
      <div class="form-panel__header">
        <div class="logo logo--dark">#1</div>
        <div>
          <h2>Punto de Venta La Number One</h2>
          <p class="muted">Autenticación segura del personal</p>
        </div>
      </div>

      <!--
        Alerta de error de credenciales (criterio de aceptación HU01):
        permanece vacía y oculta hasta que login.js la llene y la
        muestre tras una respuesta fallida del servidor.
      -->
      <div class="alert alert--error" id="loginError" role="alert" hidden></div>

      <!-- Formulario principal -->
      <form id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="correo">Correo</label>
          <input
            type="email"
            id="correo"
            name="correo"
            class="form-input"
            autocomplete="username"
            placeholder="operador.caja04@uv.mx"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-row">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="current-password"
              placeholder="••••••••••••"
              minlength="8"
              required
            />
            <button type="button" class="btn-link-add" id="togglePassword" aria-label="Mostrar contraseña">
              Mostrar
            </button>
          </div>
        </div>

        <!-- Selección de rol -->
        <fieldset class="form-group" style="border: none; padding: 0; margin: 0;">
          <legend class="form-label">Rol / Perfil de acceso</legend>
          <div class="payment-methods-grid" role="radiogroup" aria-label="Selecciona tu rol">

            <label class="payment-card payment-card--active">
              <input type="radio" name="role" value="administrador" checked />
              Administrador
              <span class="payment-card__sub">Control total</span>
            </label>

            <label class="payment-card">
              <input type="radio" name="role" value="cajero" />
              Cajero
              <span class="payment-card__sub">Ventas y turno</span>
            </label>

            <label class="payment-card">
              <input type="radio" name="role" value="almacenista" />
              Almacenista
              <span class="payment-card__sub">Inventario</span>
            </label>

          </div>
        </fieldset>

        <button type="submit" class="btn btn--primary" id="submitBtn" style="width: 100%; margin-top: 0.5rem;">
          Iniciar Sesión
        </button>
      </form>
    </section>

  </div>

  <script src="/js/login.js"></script>
</body>
</html>
