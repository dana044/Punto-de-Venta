<!--
  Punto de Venta UV — Vista de Inicio de Sesión (HU01)
  Proyecto: La Number One
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punto de Venta UV · Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/01-variables.css" />
  <link rel="stylesheet" href="/css/02-base.css" />
  <link rel="stylesheet" href="/css/04-components.css" />
  <link rel="stylesheet" href="/css/05-modals.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-body, #f1f5f9);
      padding: 1.5rem;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .auth-card {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      width: 100%;
      max-width: 960px;
      background: var(--bg-card, #ffffff);
      border-radius: var(--radius-lg, 20px);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    @media (max-width: 820px) {
      .auth-card {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       PANEL DE MARCA (IZQUIERDA - ESTILO PROTOTIPO POS UV)
       ========================================================================== */
    .brand-panel {
      background: linear-gradient(180deg, var(--color-primary, #055651), var(--color-primary-hover, #044541));
      color: var(--text-white, #ffffff);
      padding: 2rem 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
    }

    /* 1. Header superior del panel */
    .brand-panel__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-panel__header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .logo--dark {
      background: var(--color-primary, #055651);
      color: var(--text-white, #ffffff);
    }

    .brand-panel__header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .muted {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.78rem;
      margin: 0.15rem 0 0;
    }

    .badge-version {
      background: rgba(255, 255, 255, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 2. Imagen central tipo escaparate */
    .brand-panel__media {
      width: 100%;
      display: flex;
      justify-content: center; /* Mantiene la imagen centrada */
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .brand-panel__media img {
      width: auto;
      max-width: 100%;
      height: 190px;
      object-fit: contain;
      display: block;

      border: 3px solid rgba(255, 255, 255, 0.8); 
      border-radius: 16px;                       
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); 
    }

    /* 3. Textos informativos inferiores */
    .brand-panel__content {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .tagline {
      font-size: 1.35rem;
      line-height: 1.25;
      font-weight: 700;
      margin: 0;
    }

    .tagline-sub {
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.85rem;
      line-height: 1.45;
      margin: 0;
    }

    /* Métricas inferiores como en el diseño de referencia */
    .brand-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-top: 0.5rem;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-item strong {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .metric-item span {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .brand-footer {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    /* ==========================================================================
       PANEL DE FORMULARIO (DERECHA)
       ========================================================================== */
    .form-panel {
      padding: 2.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center;
    }

    .form-panel__header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .form-panel__header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main, #0f172a);
    }

    .form-panel__header .muted {
      color: var(--text-muted, #64748b);
    }

    .password-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .password-row .form-input {
      flex: 1;
    }

    /* Selector de rol reutilizando .payment-card */
    .payment-card {
      position: relative;
    }

    .payment-card input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .payment-card__sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-muted, #64748b);
      margin-top: 0.15rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md, 8px);
      margin-bottom: 0.25rem;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .alert--error {
      background-color: #FEE2E2;
      color: var(--color-danger, #ef4444);
      border: 1px solid var(--color-danger, #ef4444);
    }
  </style>
</head>
<body>

  <div class="auth-card">

    <!-- Panel de marca (Izquierda con estructura de la referencia) -->
    <section class="brand-panel">
      <!-- 1. Nombre arriba -->
      <div class="brand-panel__top">
        <div class="brand-panel__header">
          <div>
            <h1>La Number One</h1>
            <p class="muted">Tiendita de la esquina</p>
          </div>
        </div>
      </div>

      <!-- 2. Imagen centrada -->
      <div class="brand-panel__media">
        <img src="img/logo.png" alt="Logo de La Number One" />
      </div>

      <!-- 3. Tiendas para toda la familia abajo -->
      <div class="brand-panel__content">
        <h2 class="tagline">Tiendas para toda la familia</h2>
        <p class="tagline-sub">
          De la revo para el mundo.
        </p>

        <div class="brand-footer">
          🔒 Cifrado AES-256 · SSO Institucional © 2026 Universidad Veracruzana
        </div>
      </div>
    </section>

    <!-- Panel de formulario (Derecha) -->
    <section class="form-panel">
      <div class="form-panel__header">
        <div class="logo logo--dark">#1</div>
        <div>
          <h2>Punto de Venta La Number One</h2>
          <p class="muted">Autenticación segura del personal</p>
        </div>
      </div>

      <!--
        Alerta de error de credenciales (criterio de aceptación HU01):
        permanece vacía y oculta hasta que login.js la llene y la
        muestre tras una respuesta fallida del servidor.
      -->
      <div class="alert alert--error" id="loginError" role="alert" hidden></div>

      <!-- Formulario principal -->
      <form id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Usuario o Correo</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            autocomplete="username"
            placeholder="operador.caja04@uv.mx"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-row">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="current-password"
              placeholder="••••••••••••"
              minlength="8"
              required
            />
            <button type="button" class="btn-link-add" id="togglePassword" aria-label="Mostrar contraseña">
              Mostrar
            </button>
          </div>
        </div>

        <!-- Selección de rol -->
        <fieldset class="form-group" style="border: none; padding: 0; margin: 0;">
          <legend class="form-label">Rol / Perfil de acceso</legend>
          <div class="payment-methods-grid" role="radiogroup" aria-label="Selecciona tu rol">

            <label class="payment-card payment-card--active">
              <input type="radio" name="role" value="administrador" checked />
              Administrador
              <span class="payment-card__sub">Control total</span>
            </label>

            <label class="payment-card">
              <input type="radio" name="role" value="cajero" />
              Cajero
              <span class="payment-card__sub">Ventas y turno</span>
            </label>

            <label class="payment-card">
              <input type="radio" name="role" value="almacenista" />
              Almacenista
              <span class="payment-card__sub">Inventario</span>
            </label>

          </div>
        </fieldset>

        <button type="submit" class="btn btn--primary" id="submitBtn" style="width: 100%; margin-top: 0.5rem;">
          Iniciar Sesión
        </button>
      </form>
    </section>

  </div>

  <script src="/js/login.js"></script>
</body>
</html>
